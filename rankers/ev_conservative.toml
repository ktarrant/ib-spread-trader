# `ev` with a higher score floor: each candidate needs E[P/L] of at least 6 % of
# its max loss. Credit spreads stay allowed — at this floor they are nearly all
# gone anyway (they are the structure the ranker picks on its weakest views, so
# they score lowest).
#
# Chosen as a risk setting, and **that rationale did not survive**. The first
# sweep put 0.06 at 32.3 % drawdown against 44.0 % at 0.02, but it ran on
# interpolated quotes that read the other right's IV, and a higher floor selected
# exactly their mispricings. Rerun on same-right bounded interpolation (prevailing
# model, every monthly chain, credit allowed): 0.02 / 0.03 / 0.04 / 0.06 / 0.08 →
# 48.6 / 24.5 / 9.3 / 3.1 / 10.7 % return and 46.5 / 41.8 / 46.0 / 46.4 / 10.3 %
# max drawdown. No floor above 0.02 helps on either axis except 0.08, on 3 trades.
[candidates]
rights = ["call", "put"]
allow_debit = true
allow_credit = true
allow_naked_long = true
min_width = 0.0
max_relative_spread = 0.35
max_loss = 500.0
quantity = 1

[ranking]
metric = "expected_value"
min_score = 0.06
min_expected_pl = 0.0
forecast_target_quantile = 0.85
scorer_sample_per_bar = 20
