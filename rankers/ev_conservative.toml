# `ev` with a higher score floor: each candidate needs E[P/L] of at least 6 % of
# its max loss. Credit spreads stay allowed — at this floor they are nearly all
# gone anyway (they are the structure the ranker picks on its weakest views, so
# they score lowest), and a separate ban changed almost nothing.
#
# Chosen as a risk setting, not for return. On the prevailing model over every
# monthly chain (2026-10-03 snapshot, credit allowed) the floor sweep ran 0.02 /
# 0.03 / 0.04 / 0.06 / 0.08 → 45.9 / 17.7 / 13.1 / 17.8 / 11.5 % return and
# 44.0 / 39.8 / 42.4 / 32.3 / 18.7 % max drawdown: no higher floor beats 0.02 on
# return — the score orders candidates within a bar but does not compare across
# bars — and 0.06 cuts drawdown while leaving a usable trade count (14).
[candidates]
rights = ["call", "put"]
allow_debit = true
allow_credit = true
allow_naked_long = true
min_width = 0.0
max_relative_spread = 0.35
max_loss = 500.0
quantity = 1

[ranking]
metric = "expected_value"
min_score = 0.06
min_expected_pl = 0.0
forecast_target_quantile = 0.85
scorer_sample_per_bar = 20
