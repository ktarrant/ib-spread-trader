# `ev_no_credit` with a higher score floor: debit verticals and naked longs only,
# each needing E[P/L] of at least 6 % of its max loss.
#
# Chosen as a risk setting, not for return. On the prevailing model over every
# monthly chain (2026-10-03 snapshot) the floor sweep ran 0.02 / 0.03 / 0.04 /
# 0.06 / 0.08 → 48.1 / 17.2 / 8.0 / 19.1 / 10.0 % return and 42.6 / 48.4 / 44.1 /
# 30.7 / 10.8 % max drawdown: no higher floor beats 0.02 on return — the score
# orders candidates within a bar but does not compare across bars — and 0.06 is
# the lowest drawdown that still leaves a usable trade count (15).
[candidates]
rights = ["call", "put"]
allow_debit = true
allow_credit = false
allow_naked_long = true
min_width = 0.0
max_relative_spread = 0.35
max_loss = 500.0
quantity = 1

[ranking]
metric = "expected_value"
min_score = 0.06
min_expected_pl = 0.0
forecast_target_quantile = 0.85
scorer_sample_per_bar = 20
