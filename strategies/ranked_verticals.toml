# Price-target ranked verticals.
#
# Instead of a directional trigger picking one structure, this mode forecasts a
# probability distribution over the underlying at a scoring horizon, enumerates
# every debit and credit vertical the ladder can supply, marks each to model
# against the distribution, and takes the one with the best expected P/L per unit
# of risk — subject to loss and liquidity limits.

name    = "ranked-verticals"
symbols = ["SPY", "QQQ", "IWM", "AAPL", "AMZN", "META", "NVDA", "TSLA", "AMD", "COIN", "MSTR", "PLTR"]
expiry  = "2026-08-21"
initial_cash = 100000.0
mode    = "ranked"

# [execution]/[exit]/[costs] are shared with the staged mode: timing, the
# position cap, the entry gates, and the exit rules all still apply. The expiry
# rules (close >=3 days out, no entry within 8 days) are the defaults now, so a
# position always exits on a real quote rather than settling at intrinsic.
[execution]
timing = "next_bar"
max_open_positions = 1
earnings_blackout_days = 3

[exit]
profit_target_pct = 50.0
stop_loss_pct = 100.0
close_before_earnings = true
# Take profit (debit) or stop (credit) when the underlying reaches the short
# strike. A short-dated vertical only marks near its max *at* expiry, so a
# percent-of-max profit target arrives too late and winners round-trip; the
# underlying reaching the short strike is the reliable signal to close.
underlying_past_short_strike = true

[costs]
commission_per_contract = 0.65

# The indicators feeding the model.
[features]
trend_fast = 10
trend_slow = 30
atr_period = 14
realized_vol_period = 20
skew_moneyness = 0.05

# The lognormal drift model's weights. Drift is turned OFF by default: forecast
# evaluation on the reference snapshot showed the v1 drift (trend + skew) was
# miscalibrated and forecast worse than a random-walk null (CRPS skill -0.39,
# PIT mean 0.63). Zeroing it restores calibration (PIT 0.52, near-nominal
# coverage) and flips the strategy from a loser to a winner. The vol is a 50/50
# blend of realized vol and ATM IV; turn the drift weights up only once a drift
# signal has been shown to beat the null out-of-sample.
[model]
bars_per_year = 3276.0
realized_vol_weight = 0.5
fallback_vol = 0.30
trend_weight = 0.0
vwap_reversion = 0.0
skew_weight = 0.0
grid_sigma = 4.0
grid_points = 101

# Which verticals to enumerate, and the liquidity/loss limits each must clear.
[candidates]
rights = ["call", "put"]
allow_debit = true
allow_credit = true
min_width = 0.0
max_relative_spread = 0.35
max_loss = 500.0
quantity = 1

# The scoring horizon (capped at expiry) and the thresholds a trade must clear.
# One calendar week: a forecast is scored against the same weekday next week, so
# every forecast lands on a real trading bar. A 5-day horizon put Monday/Tuesday
# forecasts on the weekend, where the realized read collapsed to the prior Friday.
[ranking]
horizon_days = 7.0
# The score models the forecast-target exit (payoff capped at the target), which
# is a smaller number than the old held-to-horizon score — so the threshold is
# retuned down from 0.10. Too high collapses to a handful of trades; too low
# over-trades into losers.
min_score = 0.02
min_expected_pl = 0.0
# Close when the underlying reaches this quantile of the entry forecast in the
# trade's favour — the same forecast that set the strikes says the move has
# played out. Works for naked longs (no short strike to close on) and verticals
# alike. Lower = take profit sooner (higher win rate); too high overshoots the
# forecast's plausible range and the trade round-trips.
forecast_target_quantile = 0.85
# Evaluation: price this many candidates per bar forward to the horizon, to test
# whether the score predicts realized P/L (the scorer/decile diagnostic). Costs
# a chain resolution per bar; set to 0 to turn it off.
scorer_sample_per_bar = 20
