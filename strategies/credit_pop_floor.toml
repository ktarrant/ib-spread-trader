# Exit-axis variant of credit_pop.toml: the same credit-only, PoP-ordered entry,
# now with a live-POP give-up so a losing credit spread has a way out that is not
# the calendar. credit_pop.toml closed 0 of 28 trades on risk; this is the
# experiment that argues with that.
name      = "credit-pop-floor"
mode      = "ranked"
model     = "mean-reversion"
ranker    = "credit_pop"
portfolio = "shared_20k"
exit      = "pop_floor"
dataset   = "2026-08-21"

[execution]
timing = "next_bar"
earnings_blackout_days = 3

[costs]
commission_per_contract = 0.65
