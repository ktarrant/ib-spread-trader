# mean_reversion_prevailing, conservative: a 0.06 score floor (see
# rankers/ev_conservative.toml). A risk setting — lower drawdown and far fewer
# trades than the base prevailing model, not a better forecast.
name      = "mean-reversion-prevailing-conservative"
mode      = "ranked"
model     = "mean-reversion-prevailing"
ranker    = "ev_conservative"
portfolio = "shared_20k"
exit      = "base"
dataset   = "2026-08-21"

[execution]
timing = "next_bar"
earnings_blackout_days = 3
# The gap is the 5-session prevailing trend for a week after a release, and a
# fade there fights post-earnings drift; skill on those bars is negative.
post_earnings_blackout_sessions = 5

[costs]
commission_per_contract = 0.65
