# The control for credit_h14_mr_slow: the same 14d mean-reversion forecast on the
# shipped 10/30 SMA pair, to see whether the SMA tuning is what earns the gate.
name      = "credit-h14-mr-base"
mode      = "ranked"
model     = "mean-reversion-14d"
ranker    = "credit_pop"
portfolio = "equal_weight_1"
exit      = "forecast_stop"
dataset   = "2026-08-21"

[execution]
timing = "next_bar"
earnings_blackout_days = 3
min_entry_days_before_expiry = 14

[costs]
commission_per_contract = 0.65
