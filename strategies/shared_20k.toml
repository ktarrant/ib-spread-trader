# Shared $20k account — the portfolio/sizing-axis variation.
#
# The mean_reversion model run as one shared $20k account across all symbols
# (account = "shared"), rather than $20k per symbol. Entries compete for the pool:
# funded best-score-first, sized against the capital still free, capped at one
# position per symbol. Sizing blends a risk cap (10%/pos, 25% max) with a lot cap
# (5 contracts) for a gentle equity curve. This is the same model and scorer as
# mean_reversion.toml — only the account and sizing differ.

name    = "shared-20k"
symbols = ["SPY", "QQQ", "IWM", "AAPL", "AMZN", "META", "NVDA", "TSLA", "AMD", "COIN", "MSTR", "PLTR"]
expiry  = "2026-08-21"
initial_cash = 20000.0
mode    = "ranked"
account = "shared"

[execution]
timing = "next_bar"
max_open_positions = 50
earnings_blackout_days = 3

[sizing]
risk_per_position = 0.10
max_risk_per_position = 0.25
baseline_score = 0.02
max_lots = 5

[exit]
profit_target_pct = 50.0
stop_loss_pct = 100.0
close_before_earnings = true
underlying_past_short_strike = true

[costs]
commission_per_contract = 0.65

[features]
trend_fast = 10
trend_slow = 30
atr_period = 14
realized_vol_period = 20
skew_moneyness = 0.05

[model]
bars_per_year = 3276.0
realized_vol_weight = 0.0
fallback_vol = 0.30
trend_weight = -0.5
vwap_reversion = 0.0
skew_weight = 0.0
grid_sigma = 4.0
grid_points = 101

[candidates]
rights = ["call", "put"]
allow_debit = true
allow_credit = true
min_width = 0.0
max_relative_spread = 0.35
max_loss = 500.0
quantity = 1

[ranking]
horizon_days = 7.0
min_score = 0.02
min_expected_pl = 0.0
forecast_target_quantile = 0.85
scorer_sample_per_bar = 20
