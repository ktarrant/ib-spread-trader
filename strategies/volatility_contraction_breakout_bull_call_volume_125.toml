# Sensitivity variant of the strict 1.50x volume-confirmation baseline. This
# changes only the strategy name and same-slot volume ratio so the two runs are
# directly comparable in ib-option-viz.

name    = "volatility-contraction-breakout-bull-call-volume-125"
symbols = ["SPY", "QQQ", "IWM", "AAPL", "AMZN", "META", "NVDA", "TSLA", "AMD", "COIN", "MSTR", "PLTR"]
expiry  = "2026-08-21"
initial_cash = 100000.0

[signal]
kind = "volatility_contraction_breakout"
measure = "bollinger_width"
volatility_period = 20
contraction_lookback = 120
contraction_percentile = 0.10
breakout_period = 20
volume_lookback_sessions = 20
min_volume_ratio = 1.25
max_atm_iv_increase = 0.10

[structure]
kind = "vertical"
right = "call"
long_delta = 0.50
short_delta = 0.30
quantity = 1

[execution]
delta_tolerance = 0.07
max_debit = 1000.0
timing = "next_bar"
max_open_positions = 1
earnings_blackout_days = 3

[exit]
underlying_past_short_strike = true
stop_loss_pct = 100.0
close_before_earnings = true

[costs]
commission_per_contract = 0.65
