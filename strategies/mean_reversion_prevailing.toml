# mean_reversion with the fade restricted to spikes against the prevailing trend.
name      = "mean-reversion-prevailing"
mode      = "ranked"
model     = "mean-reversion-prevailing"
ranker    = "ev"
portfolio = "shared_20k"
exit      = "base"
dataset   = "2026-08-21"

[execution]
timing = "next_bar"
# A research DB's tape quotes are the NBBO at a bar's last print, a median 4
# minutes old; ranking by price picks stale ones. Decide entries on quotes at
# most a minute old (IB's are always fresh). See CLAUDE.md, "Stale tape quotes".
max_entry_quote_age_secs = 60
earnings_blackout_days = 3
# The gap is the 5-session prevailing trend for a week after a release, and a
# fade there fights post-earnings drift; skill on those bars is negative.
post_earnings_blackout_sessions = 5

[costs]
commission_per_contract = 0.65
