# Ranker-axis: credit-only PoP entry gated at 70% — refuse the trade rather than cut it later. Base exits, so no POP give-up.
name      = "credit-pop-high"
mode      = "ranked"
model     = "mean-reversion"
ranker    = "credit_pop_high"
portfolio = "shared_20k"
exit      = "base"
dataset   = "2026-08-21"

[execution]
timing = "next_bar"
earnings_blackout_days = 3

[costs]
commission_per_contract = 0.65
