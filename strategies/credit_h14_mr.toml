# Horizon/drift arm: mean-reversion at two weeks — tests the premise that the drift has nothing left at this distance.
#
# One cell of a 2x2 over {7d, 14d} x {mean-reversion, driftless}, holding the
# credit_pop ranker, the adverse-forecast stop, and flat one-lot sizing fixed.
# Every arm sets min_entry_days_before_expiry = 14 — the 14-day horizon requires
# it, and the 7-day arms adopt it too so all four see the *same* entry window.
# Otherwise a longer horizon would also be a shorter run, and the comparison
# would not be about the forecast.
name      = "credit-h14-mr"
mode      = "ranked"
model     = "mean-reversion-14d"
ranker    = "credit_pop"
portfolio = "equal_weight_1"
exit      = "forecast_stop"
dataset   = "2026-08-21"

[execution]
timing = "next_bar"
earnings_blackout_days = 3
min_entry_days_before_expiry = 14

[costs]
commission_per_contract = 0.65
