# mean-reversion, fading a spike only when it runs against the prevailing trend
# (5-session SMA, sloped over one session); a spike with the trend gets no view.
[features]
trend_fast = 10
trend_slow = 30
atr_period = 14
realized_vol_period = 20
skew_moneyness = 0.05
prevailing_period = 65
prevailing_slope_bars = 13

[model]
horizon_days = 7.0
bars_per_year = 3276.0
realized_vol_weight = 0.0
fallback_vol = 0.30
trend_weight = -0.5
vwap_reversion = 0.0
skew_weight = 0.0
grid_sigma = 4.0
grid_points = 101
trend_with_prevailing_only = true
