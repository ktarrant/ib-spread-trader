# The base exits plus the live-POP give-up, which is the only loss-triggered
# rule a credit spread can reach — the stop and the short-strike take-profit are
# both gated on `entry_debit > 0`.
#
# Identical to base.toml otherwise, so a strategy pointed here differs from the
# same strategy on `base` by exactly this one rule. Distinct from pop_trailing,
# which also swaps a naked long's forecast target for a trailing stop; this
# bundle leaves naked longs alone.
forecast_target_quantile = 0.85
profit_target_pct = 50.0
stop_loss_pct = 100.0
close_before_earnings = true
underlying_past_short_strike = true
close_after_forecast_horizon = true
live_pop_floor = 0.25
